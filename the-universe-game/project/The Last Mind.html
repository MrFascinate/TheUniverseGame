<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>The Universe Game — Justin "Mr. Fascinate" Shaifer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space-0: #05081a;
    --space-1: #0b1330;
    --space-2: #1a2a5e;
    --cream:   #f5e8c7;
    --cream-2: #efd9a0;
    --chrome:  #c8cdd5;
    --chrome-d:#7a828f;
    --robot:   #b87638;
    --robot-d: #7a4a1f;
    --cyan:    #5ecfd4;
    --amber:   #ffc87a;
    --ink:     #eaeef7;
    --mute:    #8b93a7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--space-0);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    overflow: hidden;
    height: 100%;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #app {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  #hero-bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
  }
  #hero-bg img {
    position: absolute;
    left: 0; right: 0;
    width: 100%;
    height: 140%;
    object-fit: cover;
    object-position: center top;
    animation: heroBgScroll 28s linear infinite alternate;
  }
  #hero-bg::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(5,8,26,0.65) 0%, rgba(5,8,26,0.45) 40%, rgba(5,8,26,0.72) 100%),
      radial-gradient(ellipse 120% 80% at 50% 35%, rgba(26,42,94,0.45) 0%, transparent 70%);
    z-index: 1;
  }
  @keyframes heroBgScroll {
    from { top: 0%; }
    to   { top: -40%; }
  }
  /* ============================================================
     HERO — widescreen, full-bleed cinematic
     ============================================================ */
  #hero {
    position: absolute; inset: 0;
    z-index: 2;
    transition: opacity 0.9s ease;
    min-height: 0;
    overflow: hidden;
  }
  #hero.hidden { opacity: 0; pointer-events: none; }
  #hero.zooming .hero-stage { animation: heroZoom 1.8s cubic-bezier(.6,.02,.3,1) forwards; }
  #hero.zooming .hero-top,
  #hero.zooming .hero-bottom { animation: heroFade 1.0s ease forwards; }
  @keyframes heroFade {
    to { opacity: 0; transform: translateY(-20px); }
  }
  @keyframes heroZoom {
    0%   { transform: scale(1); filter: brightness(1); }
    55%  { transform: scale(3.2); filter: brightness(1.1); }
    100% { transform: scale(14); filter: brightness(1.6); opacity: 0; }
  }

  /* Top nav band */
  .hero-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    padding: 14px 32px;
    padding-top: max(14px, env(safe-area-inset-top, 14px));
    padding-left: max(32px, env(safe-area-inset-left, 32px));
    padding-right: max(32px, env(safe-area-inset-right, 32px));
    z-index: 5;
    flex-wrap: wrap;
  }
  .hero-top .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--chrome);
  }
  .hero-top .brand b {
    color: var(--cream);
    font-weight: 500;
  }
  .hero-top .nav {
    display: flex;
    gap: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .hero-top .nav a { color: var(--mute); text-decoration: none; transition: color 0.25s; }
  .hero-top .nav a:hover { color: var(--cream); }

  /* Main stage: flex column — title on top, controller below */
  .hero-stage {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    will-change: transform;
    transform-origin: center 55%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
  }
  .hero-stage > * { pointer-events: auto; }

  /* Title: flow element, full width */
  .title-band {
    position: relative;
    width: 100%;
    text-align: center;
    padding: min(1vh, 8px) 6vw min(1vh, 8px);
    z-index: 3;
    pointer-events: none;
    flex-shrink: 0;
  }
  .title-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: min(2vh, 12px);
    opacity: 0.9;
  }
  .title-main {
    font-family: 'Archivo Black', sans-serif;
    color: var(--cream);
    line-height: 0.92;
    letter-spacing: -0.005em;
    text-shadow: 0 2px 0 rgba(0,0,0,0.45), 0 14px 60px rgba(0,0,0,0.6);
  }
  .title-main .the {
    display: block;
    font-size: clamp(20px, min(3vw, 4vh), 46px);
    letter-spacing: 0.28em;
    color: var(--cream-2);
    margin-bottom: 6px;
  }
  .title-main .universe,
  .title-main .game {
    display: block;
    font-size: clamp(54px, min(11vw, 14vh), 170px);
    letter-spacing: 0.04em;
    line-height: 0.94;
    white-space: nowrap;
  }
  .title-main .universe {
    background: linear-gradient(180deg, #efd9a0 0%, #efd9a0 50%, #c89642 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .title-main .game {
    background: linear-gradient(180deg, #efd9a0 0%, #efd9a0 50%, #b07a30 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .title-subline {
    margin-top: min(3vh, 20px);
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(9px, 0.85vw, 12px);
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--chrome);
  }
  .title-subline b { color: var(--cream-2); font-weight: 500; }

  /* Porthole stage — square so the chrome ring sits centered, with breathing room
     below for the press-hint. */
  .controller-stage {
    position: relative;
    width: min(48vw, 52vh);
    aspect-ratio: 1 / 1;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
    flex-shrink: 0;
    margin-bottom: 110px;
  }
  .controller-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    pointer-events: auto;
    cursor: pointer;
    filter: drop-shadow(0 18px 36px rgba(0,0,0,0.55))
            drop-shadow(0 0 24px rgba(94,207,212,0.18));
    transition: transform 0.3s ease, filter 0.3s ease;
  }
  .controller-wrap:hover {
    transform: translateY(-3px);
    filter: drop-shadow(0 22px 44px rgba(0,0,0,0.6))
            drop-shadow(0 0 36px rgba(94,207,212,0.32));
  }
  .controller-svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    pointer-events: none;
  }
  /* Play button overlay \u2014 sits centered over the Earth canvas as the primary CTA cue. */
  .play-overlay {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: clamp(56px, 22%, 96px);
    height: clamp(56px, 22%, 96px);
    z-index: 5;
    padding: 0;
    border: 1.5px solid rgba(94, 207, 212, 0.75);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%,
      rgba(8, 12, 28, 0.88) 0%,
      rgba(8, 12, 28, 0.55) 60%,
      rgba(8, 12, 28, 0)    100%);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    color: #d8fbff;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(94, 207, 212, 0.45),
                inset 0 0 10px rgba(94, 207, 212, 0.20);
    animation: playPulse 2.2s ease-in-out infinite;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .play-overlay:hover {
    transform: translate(-50%, -50%) scale(1.10);
    box-shadow: 0 0 32px rgba(94, 207, 212, 0.70),
                inset 0 0 14px rgba(94, 207, 212, 0.30);
  }
  .play-overlay:active {
    transform: translate(-50%, -50%) scale(1.04);
  }
  .play-overlay svg {
    width: 46%;
    height: 46%;
    fill: #e8feff;
    /* Optical centering \u2014 the play triangle's visual mass leans left, nudge it right */
    margin-left: 7%;
    filter: drop-shadow(0 0 6px rgba(216, 251, 255, 0.65));
  }
  @keyframes playPulse {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(94, 207, 212, 0.45),
                  0 0 20px rgba(94, 207, 212, 0.45),
                  inset 0 0 10px rgba(94, 207, 212, 0.20);
    }
    50% {
      box-shadow: 0 0 0 14px rgba(94, 207, 212, 0),
                  0 0 28px rgba(94, 207, 212, 0.55),
                  inset 0 0 14px rgba(94, 207, 212, 0.28);
    }
  }
  /* Fade out when zooming so it doesn't pop during the transition */
  #hero.zooming .play-overlay { opacity: 0; transition: opacity 0.35s ease-out; }

  /* Hero porthole Earth \u2014 positioned by JS to match SVG ring (cx=800, cy=340, r=172 in 1600x900 viewBox). */
  .hero-earth-canvas {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    border-radius: 50%;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.75);
    background: radial-gradient(circle at 50% 50%, #040820 0%, #01030a 100%);
    transition: opacity 0.35s ease-out;
  }
  /* During the Press Start zoom, fade the WebGL canvas out so any sub-pixel
     drift between the absolutely-positioned canvas and the CSS-scaled SVG
     ring is invisible. The dark porthole well underneath shows through. */
  #hero.zooming .hero-earth-canvas { opacity: 0; }
  .press-hint {
    position: absolute;
    left: 50%;
    bottom: -52px;
    transform: translateX(-50%);
    z-index: 4;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(9px, 0.85vw, 11px);
    letter-spacing: 0.42em;
    color: var(--cyan);
    text-transform: uppercase;
    padding: 9px 18px;
    border: 1px solid rgba(94, 207, 212, 0.55);
    border-radius: 999px;
    background: rgba(5, 8, 26, 0.78);
    backdrop-filter: blur(4px);
    animation: pulseHint 2.2s ease-in-out infinite;
    cursor: pointer;
    white-space: nowrap;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(94,207,212,0.45); opacity: 0.92; }
    50%      { box-shadow: 0 0 0 18px rgba(94,207,212,0); opacity: 1; }
  }

  /* Cover-out fade: black veil that fades in during the start zoom so the
     handoff to simulation.html lands on a fully black frame. */
  #zoomFade {
    position: fixed; inset: 0;
    background: #000;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.65s ease-in;
  }
  #zoomFade.active { opacity: 1; }

  /* Pre-order modal — matches simulation.html */
  .modal {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    animation: modalIn 0.22s ease-out;
  }
  .modal[hidden] { display: none; }
  @keyframes modalIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.78);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    cursor: pointer;
  }
  .modal-card {
    position: relative;
    width: min(440px, calc(100vw - 32px));
    background: rgba(12,16,32,0.98);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    padding: 32px 28px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.75);
    color: var(--ink);
    transform: translateY(8px);
    animation: cardIn 0.28s cubic-bezier(.2,.8,.2,1) 0.04s forwards;
  }
  @keyframes cardIn { to { transform: translateY(0); } }
  .modal-close {
    position: absolute; top: 10px; right: 12px;
    background: transparent; border: 0;
    width: 32px; height: 32px;
    font-size: 22px; line-height: 1;
    color: rgba(255,255,255,0.55);
    cursor: pointer;
    border-radius: 50%;
    transition: all 0.15s;
    font-family: inherit;
  }
  .modal-close:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .modal-kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 10px; font-weight: 500;
  }
  .modal-card h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 28px; line-height: 1.0;
    margin: 0 0 14px;
    color: var(--cream);
    font-weight: 800;
    letter-spacing: -0.005em;
  }
  .modal-card p {
    font-family: 'Archivo', sans-serif;
    font-size: 13px; line-height: 1.55;
    color: #c4cbdb; margin: 0 0 18px;
  }
  .modal-card .email-form {
    display: flex;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    overflow: hidden;
    backdrop-filter: none;
  }
  .modal-card .email-form input {
    padding: 12px 14px;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .modal-card .email-form button {
    padding: 0 18px;
    border-radius: 0;
  }
  .modal-card .email-form.sent input { color: var(--amber); }
  .modal-fineprint {
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.32);
  }

  /* Bottom-right CTA cluster */
  .hero-bottom {
    position: absolute;
    bottom: max(28px, env(safe-area-inset-bottom, 28px));
    right: max(36px, env(safe-area-inset-right, 36px));
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    z-index: 5;
  }
  .synopsis-blurb {
    max-width: 460px;
    color: #c4cbdb;
  }
  .synopsis-blurb .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 6px;
  }
  .synopsis-blurb p {
    font-family: 'Archivo', sans-serif;
    font-size: clamp(12px, 1.1vw, 14px);
    line-height: 1.5;
    margin: 0;
    text-wrap: pretty;
    max-width: 52ch;
  }
  .synopsis-blurb .author {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--chrome);
  }
  .synopsis-blurb .author b { color: var(--cream-2); font-weight: 500; }

  /* CTA cluster */
  .cta-cluster {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: stretch;
    width: 260px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 11px 20px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 12px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.25s ease;
    /* Reliable button semantics for the <button> element on touch devices */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    appearance: none;
    -webkit-appearance: none;
  }
  .cta-primary {
    background: var(--cream-2);
    color: var(--space-0);
    box-shadow: 0 10px 30px -8px rgba(239, 217, 160, 0.45),
                inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  .cta-primary:hover {
    background: #fff4d1;
    transform: translateY(-2px);
    box-shadow: 0 14px 40px -8px rgba(239, 217, 160, 0.65),
                inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  .cta-primary .arrow {
    display: inline-block;
    transition: transform 0.25s;
  }
  .cta-primary:hover .arrow { transform: translateX(4px); }

  .cta-secondary {
    background: transparent;
    color: var(--chrome);
    border: 1px solid rgba(200,205,213,0.35);
    padding: 9px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.36em;
  }
  .cta-secondary:hover {
    color: var(--cream);
    border-color: var(--cyan);
    background: rgba(94, 207, 212, 0.06);
  }

  .email-form {
    display: flex;
    gap: 0;
    border: 1px solid rgba(200,205,213,0.25);
    background: rgba(5, 8, 26, 0.5);
    backdrop-filter: blur(6px);
  }
  .email-form input {
    flex: 1;
    background: transparent;
    border: 0;
    padding: 10px 14px;
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    outline: none;
    min-width: 0;
  }
  .email-form input::placeholder { color: var(--mute); letter-spacing: 0.2em; text-transform: uppercase; font-size: 10px; }
  .email-form button {
    background: transparent;
    border: 0;
    border-left: 1px solid rgba(200,205,213,0.25);
    padding: 0 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--cyan);
    cursor: pointer;
    transition: all 0.2s;
  }
  .email-form button:hover { background: rgba(94, 207, 212, 0.1); color: var(--cream); }
  .email-form.sent input { color: var(--amber); }

  .scroll-hint {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--mute);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease 0.6s;
  }
  .scroll-hint.show { opacity: 0.55; }

  /* Tablet */
  @media (max-width: 900px) {
    .title-main .universe, .title-main .game { font-size: clamp(44px, 13vw, 100px); }
    .hero-bottom { right: 16px; bottom: 16px; }
    .cta-cluster { width: 220px; }
    .hero-top { padding: 10px 18px; }
    .hero-top .nav { display: none; }
    .controller-stage { width: min(48vw, 50vh); margin-bottom: 100px; }
  }

  /* Phone — center the CTA cluster below the controller, scale the title down,
     and trim the brand line so nothing wraps. Synopsis blurb gets tucked away. */
  @media (max-width: 600px) {
    .hero-top { padding: 10px 14px; }
    .hero-top .brand { font-size: 9px; letter-spacing: 0.30em; }
    .title-band { padding: min(2vh, 12px) 4vw min(1vh, 6px); }
    .title-eyebrow { font-size: 9px; letter-spacing: 0.36em; margin-bottom: 6px; }
    .title-main .the { font-size: 11px; letter-spacing: 0.28em; margin-bottom: 2px; }
    .title-main .universe, .title-main .game {
      font-size: clamp(20px, 6.3vw, 35px);
      letter-spacing: 0;
    }
    .title-subline { margin-top: 6px; font-size: 8px; letter-spacing: 0.26em; }

    /* Push controller down toward viewport center, away from the title */
    .hero-stage { padding-top: 14px; }
    .controller-stage {
      width: min(60vw, 36vh);
      aspect-ratio: 1 / 1;
      margin-top: 4vh;
      margin-bottom: 0;
    }

    .synopsis-blurb { display: none; }

    /* Pre-order sits directly below the porthole in the flex column */
    .hero-bottom {
      position: static;
      align-items: center;
      margin: 24px auto 0;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
    }
    .cta-cluster { width: 100%; max-width: 320px; }
    .cta {
      padding: 13px 18px;
      font-size: 11px; letter-spacing: 0.20em;
    }
    .cta-secondary { display: none; }

    /* Bigger Press Start tap target — must clear Apple's 44px minimum and
       suppress the legacy 300ms tap delay so the press registers on first touch. */
    .press-hint {
      font-size: 11px;
      padding: 13px 22px;
      letter-spacing: 0.32em;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .modal { align-items: flex-start; padding-top: max(8vh, env(safe-area-inset-top, 24px)); }
    .modal-card { padding: 26px 22px 20px; width: calc(100vw - 24px); }
    .modal-card h2 { font-size: 24px; }
    .modal-card p { font-size: 12.5px; line-height: 1.5; }
  }

  /* Very narrow phones */
  @media (max-width: 380px) {
    .hero-top .brand { font-size: 8px; letter-spacing: 0.22em; }
    .title-main .the { font-size: 10px; letter-spacing: 0.24em; }
    .title-main .universe, .title-main .game {
      font-size: clamp(17px, 5.6vw, 27px);
      letter-spacing: 0;
    }
    .title-subline { font-size: 7.5px; letter-spacing: 0.20em; }
    .controller-stage { margin-top: 3vh; width: min(64vw, 32vh); margin-bottom: 0; }
    .hero-bottom { margin-top: 20px; }
    .cta { padding: 12px 14px; font-size: 10px; letter-spacing: 0.18em; }
    .press-hint { font-size: 10px; padding: 12px 18px; letter-spacing: 0.28em; }
  }

  /* Short-viewport compression — collapse bottom band into a compact row */
  @media (max-height: 720px) {
    .title-main .the { font-size: clamp(18px, 2.4vh, 28px); }
    .title-main .universe, .title-main .game { font-size: clamp(44px, 11vh, 96px); }
    .title-subline { margin-top: 6px; font-size: 10px; }
    .title-eyebrow { margin-bottom: 6px; }
    .synopsis-blurb p { font-size: 11.5px; line-height: 1.4; }
    .hero-bottom { padding: 0 24px 10px; gap: 16px; }
    .cta { padding: 9px 16px; font-size: 11px; }
    .email-form input { padding: 8px 12px; }
    .press-hint { font-size: 10px; padding: 6px 14px; }
  }
  @media (max-height: 600px) {
    .hero-bottom { display: flex; justify-content: center; align-items: center; }
    .controller-stage { height: 100%; }
    .arm { width: min(30vw, 38vh); min-width: 220px; }
    .console { width: min(28vw, 40vh); min-width: 220px; }
  }

  /* ============================================================
     GAME
     ============================================================ */
  #game {
    position: absolute; inset: 0;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
  }
  #game.show { opacity: 1; pointer-events: auto; }
  #gl {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .hud {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr auto;
    padding: 22px 28px;
    pointer-events: none;
    gap: 16px;
  }
  .hud > * { pointer-events: auto; }
  .hud-top {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .back {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--chrome);
    background: rgba(11,19,48,0.55);
    border: 1px solid rgba(200,205,213,0.25);
    padding: 9px 16px;
    border-radius: 2px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.25s ease;
  }
  .back:hover { color: var(--cream); border-color: var(--cyan); }
  .hud-brand {
    font-family: 'Archivo Black', sans-serif;
    color: var(--cream);
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .hud-brand em {
    font-family: 'JetBrains Mono', monospace;
    font-style: normal;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--chrome-d);
    display: block;
    font-weight: 400;
    margin-top: 2px;
  }
  .synopsis {
    max-width: 440px;
    align-self: end;
    color: var(--ink);
    background: linear-gradient(180deg, rgba(5,8,26,0) 0%, rgba(5,8,26,0.72) 40%);
    padding: 24px 4px 12px 20px;
    border-left: 1px solid rgba(94,207,212,0.25);
  }
  .synopsis .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 10px;
  }
  .synopsis h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(28px, 3vw, 42px);
    line-height: 0.98;
    margin: 0 0 14px;
    color: var(--cream);
  }
  .synopsis p {
    font-family: 'Archivo', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    color: #c4cbdb;
    margin: 0 0 12px;
    max-width: 42ch;
    text-wrap: pretty;
  }
  .synopsis .author {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--chrome);
    margin-top: 16px;
  }
  .synopsis .author b { color: var(--cream-2); font-weight: 500; }
  .synopsis .game-cta {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 20px;
    background: var(--cream-2);
    color: var(--space-0);
    text-decoration: none;
    font-family: 'Archivo Black', sans-serif;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    transition: all 0.25s;
  }
  .synopsis .game-cta:hover { background: #fff4d1; transform: translateY(-2px); }

  .stats {
    grid-column: 2;
    grid-row: 2 / 4;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 18px;
    background: linear-gradient(180deg, rgba(11,19,48,0.45), rgba(5,8,26,0.75));
    border: 1px solid rgba(200,205,213,0.15);
    border-radius: 2px;
    backdrop-filter: blur(6px);
    font-family: 'JetBrains Mono', monospace;
  }
  .stats-title {
    font-size: 10px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--mute);
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(200,205,213,0.12);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
  }
  .stats-title b { color: var(--cyan); font-weight: 400; letter-spacing: 0.3em; }
  .stat {
    padding: 10px 0;
    border-bottom: 1px dashed rgba(200,205,213,0.08);
    cursor: pointer;
  }
  .stat:last-of-type { border-bottom: 0; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--chrome);
    margin-bottom: 6px;
  }
  .stat-row .val {
    color: var(--cream-2);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.08em;
    min-width: 52px;
    text-align: right;
  }
  .stat-bar {
    position: relative;
    height: 10px;
    background: rgba(200,205,213,0.08);
    border: 1px solid rgba(200,205,213,0.12);
    overflow: hidden;
  }
  .stat-bar .fill {
    position: absolute;
    inset: 0;
    width: 50%;
    transition: width 0.08s linear;
  }
  .stat[data-key="water"] .fill       { background: linear-gradient(90deg, #2d6fa8, #5ecfd4); }
  .stat[data-key="life"] .fill        { background: linear-gradient(90deg, #3d7a4a, #9fd089); }
  .stat[data-key="intelligence"] .fill{ background: linear-gradient(90deg, #a06a2c, #ffc87a); }
  .stat[data-key="compute"] .fill     { background: linear-gradient(90deg, #2b3a7a, #7a9eff); }
  .stat[data-key="ascension"] .fill   { background: linear-gradient(90deg, #c58a2c, #ffe7a3); }
  .stat-hint {
    margin-top: 4px;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--mute);
    text-transform: none;
    line-height: 1.4;
  }
  .preset-row { display: flex; gap: 6px; margin-top: 10px; }
  .preset {
    flex: 1;
    padding: 8px 4px;
    background: transparent;
    border: 1px solid rgba(200,205,213,0.18);
    color: var(--chrome);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .preset:hover { color: var(--cream); border-color: var(--cyan); }
  .preset.active { color: var(--space-0); background: var(--cream-2); border-color: var(--cream-2); }

  @media (max-width: 880px) {
    .hud { grid-template-columns: 1fr; padding: 14px; }
    .stats { grid-column: 1; grid-row: auto; max-height: 40vh; overflow: auto; }
    .synopsis { max-width: 100%; padding-left: 14px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="hero-bg"><img src="assets/theuniversegamephoto.jpg" alt="" /></div>

  <!-- ============================================================
       HERO
       ============================================================ -->
  <div id="hero">
    <div class="hero-top">
      <div class="brand">A NOVEL BY <b>JUSTIN "MR. FASCINATE" SHAIFER</b></div>
    </div>

    <div class="hero-stage">
      <!-- Title band spans full width -->
      <div class="title-band">
        <h1 class="title-main">
          <span class="the">THE</span>
          <span class="universe">UNIVERSE</span>
          <span class="game">GAME</span>
        </h1>
        <div class="title-subline">Ascend <b>Humanity</b> to Superintelligence.</div>
      </div>

      <!-- Porthole: clean shiny chrome ring with cyan LED accent + atmospheric bloom -->
      <div class="controller-stage">
        <div class="controller-wrap" id="controller">
          <svg class="controller-svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <!-- Outer bezel: bright top, dark bottom for that polished metal look -->
              <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0"    stop-color="#ffffff"/>
                <stop offset="0.16" stop-color="#dde2eb"/>
                <stop offset="0.42" stop-color="#86909e"/>
                <stop offset="0.65" stop-color="#3a4250"/>
                <stop offset="0.86" stop-color="#181c27"/>
                <stop offset="1"    stop-color="#0a0d14"/>
              </linearGradient>
              <!-- Inner step bezel: inverted gradient for recessed depth -->
              <linearGradient id="innerBezelGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0"    stop-color="#0c1018"/>
                <stop offset="0.32" stop-color="#22293a"/>
                <stop offset="0.58" stop-color="#5a6373"/>
                <stop offset="0.82" stop-color="#a5afbf"/>
                <stop offset="1"    stop-color="#dee3eb"/>
              </linearGradient>
              <!-- Cyan LED accent ring -->
              <radialGradient id="ledRing" cx="50%" cy="50%" r="50%">
                <stop offset="0.91"  stop-color="#5ecfd4" stop-opacity="0"/>
                <stop offset="0.96"  stop-color="#5ecfd4" stop-opacity="0.85"/>
                <stop offset="0.985" stop-color="#e8feff" stop-opacity="1"/>
                <stop offset="1"     stop-color="#5ecfd4" stop-opacity="0"/>
              </radialGradient>
              <!-- Outer atmospheric bloom -->
              <radialGradient id="outerBloom" cx="50%" cy="50%" r="50%">
                <stop offset="0.46" stop-color="#5ecfd4" stop-opacity="0"/>
                <stop offset="0.49" stop-color="#5ecfd4" stop-opacity="0.30"/>
                <stop offset="0.55" stop-color="#5ecfd4" stop-opacity="0.10"/>
                <stop offset="0.70" stop-color="#5ecfd4" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- Atmospheric cyan bloom behind the bezel -->
            <circle cx="300" cy="300" r="295" fill="url(#outerBloom)"/>

            <!-- Outer bezel — thick polished chrome ring -->
            <circle cx="300" cy="300" r="260" fill="url(#bezelGrad)"/>
            <circle cx="300" cy="300" r="260" fill="none" stroke="#000" stroke-width="1.5" opacity="0.4"/>

            <!-- Top arc highlight that wraps the upper bezel -->
            <path d="M 70 300 Q 90 100 300 88 Q 510 100 530 300"
                  fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

            <!-- Specular reflection blob, top-left -->
            <ellipse cx="220" cy="160" rx="100" ry="13" fill="#ffffff" opacity="0.55"/>
            <ellipse cx="200" cy="148" rx="50" ry="6" fill="#ffffff" opacity="0.85"/>

            <!-- Subtle bottom-curve secondary reflection -->
            <path d="M 130 380 Q 300 480 470 380"
                  fill="none" stroke="#a8b2c0" stroke-width="1.5" opacity="0.30"/>

            <!-- Inner step bezel — recessed darker metal -->
            <circle cx="300" cy="300" r="228" fill="url(#innerBezelGrad)"/>
            <circle cx="300" cy="300" r="228" fill="none" stroke="#000" stroke-width="0.8" opacity="0.5"/>

            <!-- Cyan LED accent ring -->
            <circle cx="300" cy="300" r="216" fill="url(#ledRing)"/>

            <!-- Cardinal tick marks -->
            <g stroke="#5ecfd4" stroke-width="2" stroke-linecap="round" opacity="0.75">
              <line x1="300" y1="48"  x2="300" y2="62"/>
              <line x1="300" y1="538" x2="300" y2="552"/>
              <line x1="48"  y1="300" x2="62"  y2="300"/>
              <line x1="538" y1="300" x2="552" y2="300"/>
            </g>

            <!-- 45° diagonal tick marks (subtle) -->
            <g stroke="#5ecfd4" stroke-width="1.2" stroke-linecap="round" opacity="0.40">
              <line x1="498" y1="102" x2="505" y2="95"/>
              <line x1="102" y1="102" x2="95"  y2="95"/>
              <line x1="498" y1="498" x2="505" y2="505"/>
              <line x1="102" y1="498" x2="95"  y2="505"/>
            </g>

            <!-- Inner dark well where the Earth canvas sits -->
            <circle cx="300" cy="300" r="200" fill="#020611"/>
            <!-- Rim shadow inside the well for vignette/depth -->
            <circle cx="300" cy="300" r="200" fill="none" stroke="#000" stroke-width="3" opacity="0.85"/>
          </svg>

          <!-- Live Earth canvas sits inside the porthole well -->
          <canvas id="heroEarthCanvas" class="hero-earth-canvas"></canvas>
          <!-- Play button overlay — primary visual CTA, sits over the Earth -->
          <button type="button" class="play-overlay" id="playOverlay" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4.5 7,19.5 20,12"/></svg>
          </button>
        </div>
      </div>

    <div class="hero-bottom">
      <div class="cta-cluster">
        <button type="button" class="cta cta-primary" id="preorderBtn">
          Pre-order the Book <span class="arrow">→</span>
        </button>
      </div>
    </div>
  </div>
  </div>

  <div class="scroll-hint" id="scrollHint" style="display:none"></div>
  <div id="zoomFade"></div>

  <div id="preorderModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="preorderTitle">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div class="modal-kicker">Pre-order</div>
      <h2 id="preorderTitle">The Universe Game</h2>
      <p>Drop your email and we'll let you know the moment pre-orders open.</p>
      <form id="preorderForm" class="email-form" action="https://formspree.io/f/mnjwajny" method="POST" novalidate>
        <input type="email" name="email" placeholder="Email address" required autocomplete="email" aria-label="Email address" />
        <button type="submit">Notify me</button>
      </form>
      <div class="modal-fineprint">No spam. Unsubscribe anytime.</div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="game.js?v=22"></script>
</body>
</html>
