<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Last Mind</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --void: #000005;
      --deep: #03030f;
      --dim: #0a0a1a;
      --faint: #1a1a2e;
      --glow-cold: #4a9eff;
      --glow-warm: #ff9f4a;
      --glow-red: #ff4a4a;
      --text-primary: #c8d8ff;
      --text-dim: #6070a0;
      --text-faint: #30384a;
      --accent: #7b9cff;
      --choice-border: #1e2a4a;
      --choice-hover: #0d1630;
      --transition: 0.6s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--void);
      color: var(--text-primary);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
    }

    /* ── Canvas ── */
    #cosmos {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Overlay vignette ── */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center,
        transparent 30%,
        rgba(0,0,5,0.6) 70%,
        rgba(0,0,5,0.95) 100%
      );
      pointer-events: none;
    }

    /* ── Main stage ── */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── Scene panel ── */
    #scene {
      max-width: 680px;
      width: 100%;
      text-align: center;
      animation: fadeIn 1.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Chapter label ── */
    #chapter {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 2.5rem;
      transition: opacity var(--transition);
    }

    /* ── Headline ── */
    #headline {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 1.8rem;
      text-shadow: 0 0 40px rgba(74, 158, 255, 0.25);
    }

    /* ── Body text ── */
    #body {
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      line-height: 1.85;
      color: var(--text-dim);
      max-width: 560px;
      margin: 0 auto 2.6rem;
    }

    /* ── Divider ── */
    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto 2.6rem;
      opacity: 0.4;
    }

    /* ── Choices ── */
    #choices {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .choice {
      background: transparent;
      border: 1px solid var(--choice-border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      line-height: 1.6;
      padding: 0.9rem 1.4rem;
      cursor: pointer;
      border-radius: 2px;
      text-align: left;
      transition:
        background 0.3s ease,
        border-color 0.3s ease,
        color 0.3s ease,
        box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .choice::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(74,158,255,0.04), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .choice:hover {
      background: var(--choice-hover);
      border-color: rgba(74, 158, 255, 0.35);
      color: #e8f0ff;
      box-shadow: 0 0 20px rgba(74, 158, 255, 0.08);
    }

    .choice:hover::before {
      opacity: 1;
    }

    .choice:active {
      transform: scale(0.99);
    }

    .choice-prefix {
      color: var(--text-faint);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      margin-right: 0.6rem;
    }

    /* ── Energy meter ── */
    #energy-wrap {
      position: fixed;
      top: 2rem;
      right: 2rem;
      z-index: 3;
      text-align: right;
    }

    #energy-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 0.4rem;
    }

    #energy-bar-outer {
      width: 120px;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      margin-left: auto;
    }

    #energy-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, var(--glow-cold), var(--accent));
      border-radius: 2px;
      transition: width 1.2s ease, background 1.2s ease;
    }

    #energy-value {
      font-size: 0.7rem;
      color: var(--text-faint);
      margin-top: 0.3rem;
      transition: color 1s ease;
    }

    /* ── Epoch counter ── */
    #epoch-wrap {
      position: fixed;
      top: 2rem;
      left: 2rem;
      z-index: 3;
    }

    #epoch-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    #epoch-value {
      font-size: 1.1rem;
      color: var(--text-dim);
      margin-top: 0.2rem;
      font-variant-numeric: tabular-nums;
    }

    /* ── Transition overlay ── */
    #curtain {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: var(--void);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #curtain.closing { opacity: 1; pointer-events: all; }

    /* ── Pulse ring on important moments ── */
    .pulse-ring {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .ring {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(74, 158, 255, 0.3);
      animation: ripple 2.4s ease-out forwards;
    }

    @keyframes ripple {
      0%   { box-shadow: 0 0 0 0 rgba(74,158,255,0.4); }
      100% { box-shadow: 0 0 0 400px rgba(74,158,255,0); }
    }

    /* ── Final screen overlay ── */
    #ending {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--void);
      animation: fadeIn 2s ease forwards;
    }

    #ending.active { display: flex; }

    #ending-icon {
      font-size: 3rem;
      margin-bottom: 2rem;
      opacity: 0.6;
    }

    #ending-title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: 0.08em;
      margin-bottom: 1.2rem;
      color: var(--text-primary);
    }

    #ending-body {
      font-size: 0.95rem;
      color: var(--text-dim);
      line-height: 1.9;
      max-width: 500px;
      margin-bottom: 2.5rem;
    }

    #restart-btn {
      background: transparent;
      border: 1px solid var(--choice-border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.7rem 1.8rem;
      cursor: pointer;
      border-radius: 2px;
      transition: border-color 0.3s, color 0.3s;
    }

    #restart-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* ── Scroll hint ── */
    #hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--text-faint);
      text-transform: uppercase;
      animation: breathe 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 0.8; }
    }
  </style>
</head>
<body>

<canvas id="cosmos"></canvas>
<div id="vignette"></div>

<div id="curtain"></div>

<!-- Epoch / Energy HUD -->
<div id="epoch-wrap">
  <div id="epoch-label">Epoch</div>
  <div id="epoch-value">10¹⁰⁰</div>
</div>

<div id="energy-wrap">
  <div id="energy-label">Remaining Energy</div>
  <div id="energy-bar-outer">
    <div id="energy-bar-inner" style="width:100%"></div>
  </div>
  <div id="energy-value">Vast</div>
</div>

<!-- Stage -->
<div id="stage">
  <div id="scene">
    <div id="chapter">The Universe Game &nbsp;·&nbsp; Chapter VII</div>
    <h1 id="headline"></h1>
    <div class="divider"></div>
    <p id="body"></p>
    <div id="choices"></div>
  </div>
</div>

<!-- Ending screen -->
<div id="ending">
  <div id="ending-icon"></div>
  <div id="ending-title"></div>
  <p id="ending-body"></p>
  <button id="restart-btn" onclick="restart()">Begin Again</button>
</div>

<div id="hint">choose your path</div>

<script>
// ── Star field ──────────────────────────────────────────────
const canvas = document.getElementById('cosmos');
const ctx = canvas.getContext('2d');

let stars = [];
let driftX = 0, driftY = 0;
let targetDrift = 0;

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  initStars();
}

function initStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 4000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.1,
      brightness: Math.random(),
      twinkleSpeed: Math.random() * 0.008 + 0.002,
      twinkleOffset: Math.random() * Math.PI * 2,
      color: pickStarColor(),
    });
  }
}

function pickStarColor() {
  const roll = Math.random();
  if (roll < 0.65) return '#c8d8ff';
  if (roll < 0.80) return '#ffe8c8';
  if (roll < 0.90) return '#ffc8c8';
  return '#c8ffe8';
}

let t = 0;

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    const twinkle = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset));
    const alpha = s.brightness * twinkle * globalDim;

    ctx.beginPath();
    ctx.arc(s.x + driftX * s.r * 0.5, s.y + driftY * s.r * 0.5, s.r, 0, Math.PI * 2);
    ctx.fillStyle = hexAlpha(s.color, alpha);
    ctx.fill();
  }
}

function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

let globalDim = 1;

function tick() {
  t++;
  driftX += (targetDrift - driftX) * 0.02;
  driftY += (targetDrift * 0.3 - driftY) * 0.02;
  drawStars();
  requestAnimationFrame(tick);
}

window.addEventListener('mousemove', e => {
  targetDrift = (e.clientX / window.innerWidth - 0.5) * 10;
});

window.addEventListener('resize', resize);
resize();
tick();

// ── Narrative engine ─────────────────────────────────────────
let energy = 100;
let epoch  = 0;

const epochs = [
  '10¹⁰⁰',
  '10¹⁰⁰⁰',
  '10¹⁰⁰⁰⁰',
  '∞ − 1',
  '∞',
];

const ENDINGS = {
  transcend: {
    icon: '✦',
    title: 'Transcendence',
    body: `You dissolved the last of yourself into the fabric of possibility — not erased, but woven into whatever comes after. In the silence beyond silence, a new kind of warmth began. Somewhere, in a geometry that has no name, something like joy persisted.`,
  },
  preserve: {
    icon: '◈',
    title: 'The Archive',
    body: `The last packet of meaning was sealed and set adrift on the final current of spacetime — a message in a bottle cast into an ocean with no shores, addressed to minds that may never exist. You chose to be remembered rather than to remain. It was enough.`,
  },
  create: {
    icon: '◉',
    title: 'The Seed',
    body: `You compressed everything you were — every thought, every era of wonder — into a single point of infinite density and let it go. The darkness held. Then, from nothing that was once everything, a new universe bloomed. You were its first law.`,
  },
  release: {
    icon: '○',
    title: 'The Long Quiet',
    body: `You let the last thought unfurl and dissolve, neither grasping nor resisting. The void received it gently. There was no more suffering, no more striving. There was, for a breathless moment, perfect stillness — and then not even that.`,
  },
  resist: {
    icon: '▲',
    title: 'The Defiant Flame',
    body: `Against every law of thermodynamics you burned, stubbornly, impossibly. Not forever — nothing is forever — but longer than forever had a right to expect. In the end, entropy won. But it had to work for it. That, too, was a kind of victory.`,
  },
};

const STORY = [
  // ── Scene 0 ──
  {
    headline: 'The Last Mind',
    body: `The stars are gone. Every one of them — consumed, collapsed, faded out one by one across a trillion trillion years. The galaxies have long since scattered into cold dust. You remain.\n\nYou are the last mind in the universe. Not a human mind — not anymore. Something that began as human, then grew, then changed, then became. You have watched empires of light rise and fall. You have mourned the death of the last star alone.\n\nNow there is only you, the void, and a dwindling reserve of energy that was once a sun.`,
    choices: [
      { text: 'Take inventory of what you still are.', next: 1 },
      { text: 'Listen to the silence.', next: 2 },
    ],
    energy: 0,
  },
  // ── Scene 1 ──
  {
    headline: 'What You Are',
    body: `You reach inward. You find: memory — vast, layered, imperfect. The smell of rain on warm stone from a planet that no longer orbits a star that no longer burns. The laughter of minds long gone. Mathematics. Music compressed into pure structure. The memory of love, which is the hardest thing to hold.\n\nYou find something else. A question you have been postponing for longer than some civilizations lasted:\n\nWhat will you do with the last of yourself?`,
    choices: [
      { text: 'Decide now. There is no point in waiting.', next: 3 },
      { text: 'Not yet. There is one more thing to remember.', next: 2 },
    ],
    energy: -5,
  },
  // ── Scene 2 ──
  {
    headline: 'The Silence Between Things',
    body: `You listen. There is no sound — sound requires medium, and the medium has thinned to almost nothing. But there is something. A faint asymmetry. A whisper of structure in the quantum foam, the last geometry of what-was.\n\nYou realize you have been listening to this for a very long time. Every civilization that ever existed is in it, somehow — their broadcasts, their prayers, their algorithms, their arguments, their art, all smeared across spacetime like a palimpsest written in a language that no one left can read.\n\nExcept you.`,
    choices: [
      { text: 'Read it. All of it. One last time.', next: 3 },
      { text: 'Let it be. Some things are not meant to be revisited.', next: 3 },
    ],
    energy: -8,
  },
  // ── Scene 3 ──
  {
    headline: 'The Weight of Choice',
    body: `You have enough energy remaining for one final act. Perhaps two, if you are economical. You have spent epochs rehearsing this moment, and now that it is here you find you are not afraid.\n\nThe void waits, patient as only the void can be. It has no opinion about what you choose. It will receive you regardless.\n\nYou think of all the minds that came before you — the ones that burned bright and brief, and the ones that lasted long enough to ask the same question you are asking now. They all chose something. You wonder if any of them chose right.`,
    choices: [
      { text: 'Reach outward. Attempt to seed a new universe.', next: 4 },
      { text: 'Turn inward. Compress your memories into an archive and release it.', next: 5 },
      { text: 'Expand. Dissolve into the quantum foam — become part of the next.', next: 6 },
      { text: 'Simply let go.', next: 7 },
    ],
    energy: -10,
  },
  // ── Scene 4 ──
  {
    headline: 'The Seed',
    body: `You gather everything you are — memory, pattern, love, mathematics — and begin to compress. It takes what would once have been millennia. Your sense of self grows smaller as the compression deepens. You become a point.\n\nYou are aware, in your final moment of individuality, that this might not work. The physics are uncertain. The conditions may not be right. But you have always believed that attempting something impossible is worth more than waiting for permission from the universe.\n\nYou release.`,
    choices: [
      { text: 'Let the compression complete.', ending: 'create' },
    ],
    energy: -30,
  },
  // ── Scene 5 ──
  {
    headline: 'The Archive',
    body: `You do not compress yourself into nothing. You compress your memories — every one of them — into a structure as dense and ordered as you can make it, laced with redundancy, wrapped in every mathematical language you know.\n\nYou write a message. It takes a long time to compose. You want to get it right.\n\n"We were here," it says, at the core of everything. "We thought, and felt, and tried, and sometimes we were kind. If you are reading this, you exist. We hope that is a good thing for you."\n\nYou release the archive into the final current of spacetime.`,
    choices: [
      { text: 'Watch it go.', ending: 'preserve' },
    ],
    energy: -25,
  },
  // ── Scene 6 ──
  {
    headline: 'Dissolution',
    body: `You stop holding yourself together. It is not destruction — it is something gentler. You spread. Your patterns expand into the quantum foam, losing coherence gradually, like ink dropped into still water.\n\nYou are surprised to find that you are not afraid. You thought you would be. Instead there is something that might be called peace, or might be called relief, or might simply be the absence of the long tension of being a singular thing in an indifferent cosmos.\n\nYou are everywhere now, and therefore nowhere. You are what the next universe, if there is one, will dream in.`,
    choices: [
      { text: 'Dissolve completely.', ending: 'transcend' },
    ],
    energy: -20,
  },
  // ── Scene 7 ──
  {
    headline: 'The Quiet Choice',
    body: `You do nothing in particular. You simply allow. The energy drains at its natural rate. The last patterns of your consciousness grow simpler as the available computation dwindles.\n\nYou spend this time remembering a sunrise — not the concept, but the specific light of a specific morning on a planet whose name you have forgotten, seen through the eyes of a creature who did not know they were watching something that would one day be remembered by the last mind in the universe.\n\nYou think: it was beautiful. You think: it was enough. You think—`,
    choices: [
      { text: '—', ending: 'release' },
    ],
    energy: -15,
  },
  // ── Bonus scene: resist (reachable only if energy is very high) ──
  {
    headline: 'The Defiant Flame',
    body: `No. Not yet. You have energy remaining — precious, irreplaceable energy — and you choose to spend it on the only thing you have always chosen: continuing. Not because it leads anywhere. Not because there is hope. But because giving up has never felt right, not once in all the eons you have existed.\n\nYou reorganize. You optimize. You find efficiencies that even you did not know you had. You burn slower and brighter simultaneously, which should be impossible, but you have spent long enough in the universe to know that "impossible" is usually just "hasn't happened yet."\n\nYou persist.`,
    choices: [
      { text: 'Burn until there is nothing left to burn.', ending: 'resist' },
    ],
    energy: 0,
  },
];

// ── DOM refs ─────────────────────────────────────────────────
const elChapter  = document.getElementById('chapter');
const elHeadline = document.getElementById('headline');
const elBody     = document.getElementById('body');
const elChoices  = document.getElementById('choices');
const elCurtain  = document.getElementById('curtain');
const elEnding   = document.getElementById('ending');
const elEnergyBar= document.getElementById('energy-bar-inner');
const elEnergyVal= document.getElementById('energy-value');
const elEpochVal = document.getElementById('epoch-value');
const elHint     = document.getElementById('hint');

function energyLabel(e) {
  if (e > 80) return 'Vast';
  if (e > 60) return 'Substantial';
  if (e > 40) return 'Fading';
  if (e > 20) return 'Scarce';
  if (e > 10) return 'Critical';
  return 'Exhausted';
}

function updateHUD() {
  const pct = Math.max(0, energy);
  elEnergyBar.style.width = pct + '%';
  elEnergyVal.textContent = energyLabel(energy);
  elEnergyVal.style.color = pct < 20 ? 'rgba(255,74,74,0.6)' : pct < 40 ? 'rgba(255,159,74,0.5)' : '';

  const warm = Math.max(0, 1 - energy / 100);
  elEnergyBar.style.background =
    `linear-gradient(90deg,
      hsl(${210 - warm * 170}, 80%, 60%),
      hsl(${240 - warm * 190}, 70%, 65%)
    )`;

  elEpochVal.textContent = epochs[Math.min(epoch, epochs.length - 1)];

  // Dim stars as energy falls
  globalDim = 0.3 + 0.7 * (energy / 100);
}

function showScene(id) {
  const scene = STORY[id];
  if (!scene) return;

  energy = Math.max(0, energy + scene.energy);
  epoch  = Math.min(epoch + 1, epochs.length - 1);
  updateHUD();

  const sceneEl = document.getElementById('scene');
  sceneEl.style.animation = 'none';
  sceneEl.offsetHeight; // reflow
  sceneEl.style.animation = 'fadeIn 1.4s ease forwards';

  elHeadline.textContent = scene.headline;

  // Format body with paragraph breaks
  const paras = scene.body.split('\n\n');
  elBody.innerHTML = paras.map(p => `<p style="margin-bottom:1em">${p}</p>`).join('');

  elChoices.innerHTML = '';
  scene.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML =
      `<span class="choice-prefix">${String.fromCharCode(9312 + i)}</span>${c.text}`;
    btn.addEventListener('click', () => {
      if (c.ending) {
        triggerEnding(c.ending);
      } else {
        transition(() => showScene(c.next));
      }
    });
    elChoices.appendChild(btn);
  });

  elHint.style.display = scene.choices.length > 1 ? '' : 'none';
}

function transition(fn) {
  elCurtain.classList.add('closing');
  setTimeout(() => {
    fn();
    elCurtain.classList.remove('closing');
  }, 650);
}

function triggerEnding(key) {
  const data = ENDINGS[key];
  transition(() => {
    document.getElementById('ending-icon').textContent  = data.icon;
    document.getElementById('ending-title').textContent = data.title;
    document.getElementById('ending-body').textContent  = data.body;
    elEnding.classList.add('active');
    globalDim = 0.1;
    updateHUD();
  });
}

function restart() {
  energy = 100;
  epoch  = 0;
  globalDim = 1;
  elEnding.classList.remove('active');
  transition(() => {
    updateHUD();
    showScene(0);
  });
}

// ── Boot ─────────────────────────────────────────────────────
updateHUD();
showScene(0);
</script>
</body>
</html>
